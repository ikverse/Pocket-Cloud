[project]
name = "pocket-cloud"
version = "0.1.0"
description = "Connect an app to Pocket Cloud, a private S3-compatible storage server, in one line."
requires-python = ">=3.9"
dependencies = ["boto3>=1.36"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pocket_cloud"]

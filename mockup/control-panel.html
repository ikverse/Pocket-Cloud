<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<style>
:root {
  --bg: #111217;
  --panel: #181b1f;
  --panel2: #22252b;
  --line: #2a2e35;
  --line2: #3a3e46;
  --text: #d8d9da;
  --muted: #8e9099;
  --faint: #6e7079;
  --blue: #5794f2;
  --green: #73bf69;
  --yellow: #f2cc0c;
  --orange: #ff9830;
  --red: #f2495c;
  --purple: #b877d9;
  --mono: ui-monospace, Consolas, "Cascadia Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 13px/1.45 Inter, Roboto, "Segoe UI", system-ui, sans-serif; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* Top bar */
.top { height: 48px; display: flex; align-items: center; gap: 18px; padding: 0 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.brand { font-weight: 600; font-size: 14px; }
.top .host { color: var(--muted); }
.top .spacer { flex: 1; }
.top .note { color: var(--faint); }

/* Layout */
.layout { display: flex; min-height: calc(100vh - 48px); }
nav.side { width: 196px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 10px 0; }
nav.side a { display: block; padding: 7px 16px; color: var(--muted); border-left: 2px solid transparent; }
nav.side a:hover { color: var(--text); text-decoration: none; background: var(--panel2); }
nav.side a.on { color: var(--text); background: var(--panel2); border-left-color: var(--blue); }
nav.side .count { float: right; color: var(--faint); }
nav.side .count.warn { color: var(--yellow); }
main { flex: 1; min-width: 0; padding: 20px 24px 40px; }
section[hidden] { display: none; }

h1 { font-size: 18px; font-weight: 500; margin: 0 0 2px; }
.sub { color: var(--muted); margin: 0 0 16px; }
h2 { font-size: 14px; font-weight: 500; margin: 24px 0 8px; }

.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.span2 { grid-column: span 2; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; min-width: 0; }
.panel > h3 { font-size: 13px; font-weight: 500; margin: 0; padding: 9px 14px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; gap: 10px; }
.panel > h3 .r { margin-left: auto; font-weight: 400; color: var(--muted); }
.panel .body { padding: 12px 14px; }
.chart { padding: 8px 6px 4px; min-height: 230px; }

.stat { padding: 12px 14px; }
.stat .l { color: var(--muted); }
.stat .v { font-size: 24px; font-weight: 400; margin: 2px 0 1px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--panel2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.ok { color: var(--green); }
.warn { color: var(--yellow); }
.bad { color: var(--red); }
.wrap { white-space: normal; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.bar { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; min-width: 90px; }
.bar i { display: block; height: 100%; }
.alloc { display: flex; align-items: center; gap: 10px; }
.alloc .bar { flex: 1; }
.alloc span { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

.seg { display: flex; height: 10px; border-radius: 2px; overflow: hidden; background: var(--panel2); margin: 6px 0 12px; }
.seg i { display: block; height: 100%; }
.segw { position: relative; margin: 10px 0 12px; }
.segw .seg { margin: 0; }
.segw .lim { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text); border-radius: 1px; }
.legend-row { display: flex; justify-content: space-between; padding: 4px 0; border-top: 1px solid var(--line); }
.legend-row:first-of-type { border-top: none; }

.btn { background: var(--panel2); border: 1px solid var(--line2); color: var(--text); padding: 5px 12px; border-radius: 3px;
  font: inherit; cursor: pointer; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: #3d71d9; border-color: #3d71d9; color: #fff; }
.btn.danger { color: var(--red); }
.btn.sm { padding: 2px 9px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
td.actions { display: table-cell; white-space: nowrap; text-align: right; }
td.actions .btn + .btn { margin-left: 6px; }

input[type=text], input[type=number], input[type=time], input[type=password], select {
  background: var(--bg); border: 1px solid var(--line2); color: var(--text); padding: 5px 8px; border-radius: 3px; font: inherit; }
input[type=number] { width: 84px; }
input[type=checkbox] { accent-color: var(--blue); width: 15px; height: 15px; vertical-align: -3px; }
input:focus, select:focus { outline: 1px solid var(--blue); outline-offset: -1px; }

.form .row { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.form .row:last-child { border-bottom: none; }
.form [data-ag] .row:last-child { border-bottom: 1px solid var(--line); }
.form .row .h { color: var(--muted); font-size: 12px; margin-top: 1px; }
.form .row .c { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs a { color: var(--muted); padding: 8px 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs a:hover { color: var(--text); text-decoration: none; }
.tabs a.on { color: var(--text); border-bottom-color: var(--blue); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.filters input[type=text] { width: 220px; }

pre.block { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
  font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow-x: auto; color: var(--text); }
pre.log { max-height: 560px; }

.crumbs { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { cursor: pointer; }
.back { display: inline-block; margin-bottom: 10px; cursor: pointer; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
.kv .k { color: var(--muted); }
.alert-line { display: flex; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
.alert-line:last-child { border-bottom: none; }
.alert-line .when { color: var(--muted); white-space: nowrap; margin-left: auto; }

/* Sliders: thin track, blue fill, round handle, number box beside */
.sl { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 460px; }
.sl.compact { max-width: 300px; }
.sl-track { flex: 1; position: relative; min-width: 120px; }
.sl.has-marks .sl-track { padding: 18px 0 18px; }
.sl.has-marks .sl-marks { top: 36px; }
.sl-marks .mk.up { top: -36px; padding-top: 0; padding-bottom: 7px; }
.sl-marks .mk.up i { top: auto; bottom: 0; }
.sl-range { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer; display: block; }
.sl-range:focus { outline: none; }
.sl-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, #5794f2 var(--p), #3a3e46 var(--p)); }
.sl-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #d8d9da; border: 2px solid #5794f2; margin-top: -5px; }
.sl-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(87,148,242,0.35); }
.sl-range::-moz-range-track { height: 4px; border-radius: 2px; background: #3a3e46; }
.sl-range::-moz-range-progress { height: 4px; border-radius: 2px; background: #5794f2; }
.sl-range::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #d8d9da; border: 2px solid #5794f2; }
.sl input.sl-num { width: 76px; }
.sl .unit { color: var(--muted); min-width: 52px; }
.sl-marks { position: absolute; left: 0; right: 0; top: 18px; height: 16px; }
.sl-marks .mk { position: absolute; top: 0; transform: translateX(var(--tx, -50%)); font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 7px; }
.sl-marks .mk i { position: absolute; top: 0; left: var(--tick, 50%); width: 2px; height: 6px; margin-left: -1px; border-radius: 1px; }
.sl-preview { color: var(--muted); }
.thr { display: flex; align-items: center; gap: 10px; }
.thr > span { width: 40px; }

/* Popup */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { width: min(560px, 100%); }
.modal-box .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--line); }
.alloc-click { cursor: pointer; padding: 6px 0; }
.alloc-click:hover .bar { outline: 1px solid var(--faint); outline-offset: 3px; }

/* uPlot on dark */
.uplot, .u-legend { font-family: inherit; color: var(--muted); }
.u-legend { font-size: 12px; }
.u-legend .u-marker { border-radius: 2px; }
.u-select { background: rgba(87,148,242,0.12); }

@media (max-width: 1100px) {
  .g4 { grid-template-columns: repeat(2, 1fr); }
  .g2 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
}
@media (max-width: 820px) {
  .layout { display: block; }
  nav.side { width: auto; display: flex; overflow-x: auto; padding: 0; border-right: none; border-bottom: 1px solid var(--line); }
  nav.side a { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; padding: 10px 12px; }
  nav.side a.on { border-bottom-color: var(--blue); }
  nav.side .count { float: none; margin-left: 6px; }
  main { padding: 16px; }
  .g2 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .form .row { grid-template-columns: 1fr; gap: 6px; }
  .top .host, .top .note { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <span class="brand">Pocket Cloud</span>
  <span class="host">pocket · 100.92.14.7</span>
  <span><span class="dot" style="background:var(--green)"></span>Healthy</span>
  <span class="spacer"></span>
  <span class="note">Mockup · sample data</span>
  <span class="muted" id="updated"></span>
</header>

<div class="layout">
  <nav class="side" id="nav"></nav>
  <main>
    <section id="p-overview" hidden></section>
    <section id="p-storage" hidden></section>
    <section id="p-apps" hidden></section>
    <section id="p-devices" hidden></section>
    <section id="p-files" hidden></section>
    <section id="p-jobs" hidden></section>
    <section id="p-alerts" hidden></section>
    <section id="p-settings" hidden></section>
    <section id="p-logs" hidden></section>
  </main>
</div>
<div class="modal" id="modal" hidden onclick="if (event.target === this) closeModal()"><div class="panel modal-box" id="modal-box"></div></div>

<script>
/* ---------- helpers ---------- */
const C = { green:'#73bf69', yellow:'#f2cc0c', blue:'#5794f2', orange:'#ff9830', red:'#f2495c', purple:'#b877d9',
            muted:'#8e9099', line:'#2a2e35', grey:'#5c6370' };
const KB = 1024, MB = 1024 ** 2, GB = 1024 ** 3;
const NOW = new Date(2026, 9, 10, 22, 58, 5);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261010);
const n = x => Math.round(x).toLocaleString('en-US');
function fb(b) { if (b < 1024) return Math.round(b) + ' B'; const u = ['KB','MB','GB','TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < 3);
  return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + ' ' + u[i]; }
const fgb = g => fb(g * GB);
const fmb = m => fb(m * MB);
const pad = x => String(x).padStart(2, '0');
const hms = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function pick(list, weights) { const s = weights.reduce((a, b) => a + b, 0); let r = R() * s;
  for (let i = 0; i < list.length; i++) { r -= weights[i]; if (r <= 0) return list[i]; } return list[list.length - 1]; }
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const barColor = (pct, warn) => pct >= 100 ? C.red : pct >= warn ? C.yellow : C.green;
const allocCell = (pct, warn) => `<div class="alloc"><div class="bar"><i style="width:${Math.min(pct,100)}%;background:${barColor(pct,warn)}"></i></div><span class="${pct>=100?'bad':pct>=warn?'warn':''}">${pct.toFixed(0)}%</span></div>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- sliders ---------- */
// Every numeric setting: a range slider plus a number box; moving either updates the other.
const gbv = x => (Math.round(x * 100) / 100) + ' GB';
const markLeft = (v, min, max) => { const P = (v - min) / (max - min) * 100; return `calc(${P}% + ${7 - P * 0.14}px)`; };
// labels near either end of the track hang inwards instead of off the edge
const markEdge = P => P < 12 ? '--tx:0%;--tick:0%' : P > 88 ? '--tx:-100%;--tick:100%' : '--tx:-50%;--tick:50%';
function slider({ min, max, step = 1, value, unit = '', none = false, marks = null, cls = '', compact = false }) {
  const v = Math.min(max, Math.max(min, value));
  const p = (v - min) / (max - min) * 100;
  const mk = m => { const mv = Math.min(max, Math.max(min, m.v));
    return `<span class="mk${m.k === 'warn' ? ' up' : ''}" data-k="${m.k || ''}" style="left:${markLeft(mv, min, max)};${markEdge((mv - min) / (max - min) * 100)}"><i style="background:${m.color}"></i>${m.label}</span>`; };
  return `<div class="sl ${cls}${compact ? ' compact' : ''}${marks ? ' has-marks' : ''}">
    <div class="sl-track"><input type="range" class="sl-range" min="${min}" max="${max}" step="${step}" value="${v}" style="--p:${p}%"${none ? ' data-none="1"' : ''}>
      ${marks ? `<div class="sl-marks">${marks.map(mk).join('')}</div>` : ''}</div>
    <input type="number" class="sl-num" min="${min}" max="${max}" step="${step}" value="${none && v === min ? '' : v}"${none ? ' placeholder="none"' : ''}><span class="unit">${unit}</span></div>`;
}
function paint(r) { r.style.setProperty('--p', ((+r.value - +r.min) / (+r.max - +r.min) * 100) + '%'); }
// Allocation groups: the allocation slider, its warning slider and the per-device cap work together.
function refreshGroup(g) {
  if (!g) return;
  const alloc = +g.querySelector('.sl-alloc .sl-range').value;
  const warnEl = g.querySelector('.sl-warn .sl-range');
  const warn = warnEl ? +warnEl.value : +g.dataset.warn;
  const used = +g.dataset.used;
  const pct = used / alloc * 100;
  g.querySelector('.sl-preview').innerHTML =
    `${fgb(used)} of ${gbv(alloc)} used <span class="${pct >= 100 ? 'bad' : pct >= warn ? 'warn' : ''}">(${pct.toFixed(0)}%)</span>, warning at ${gbv(alloc * warn / 100)}`;
  const ar = g.querySelector('.sl-alloc .sl-range');
  const wm = g.querySelector('.sl-alloc .mk[data-k="warn"]');
  if (wm) {
    const wv = alloc * warn / 100, P = (wv - +ar.min) / (+ar.max - +ar.min) * 100;
    wm.style.display = wv < +ar.min ? 'none' : '';
    wm.style.left = markLeft(Math.max(+ar.min, wv), +ar.min, +ar.max);
    markEdge(P).split(';').forEach(d => { const [k, v] = d.split(':'); wm.style.setProperty(k, v); });
  }
  const cap = g.querySelector('.sl-cap');
  if (cap) {
    const cr = cap.querySelector('.sl-range'), cn = cap.querySelector('.sl-num');
    cr.max = cn.max = alloc;
    if (+cr.value > alloc) { cr.value = alloc; if (cn.value !== '') cn.value = alloc; }
    paint(cr);
  }
}
document.addEventListener('input', e => {
  const t = e.target, box = t.closest('.sl');
  if (!box) return;
  const r = box.querySelector('.sl-range'), num = box.querySelector('.sl-num');
  if (t === r) num.value = (r.dataset.none && +r.value === +r.min) ? '' : r.value;
  else if (t === num && num.value !== '') r.value = Math.min(+r.max, Math.max(+r.min, +num.value));
  else if (t === num) r.value = r.min;
  paint(r);
  refreshGroup(box.closest('[data-ag]'));
  refreshPool(box.closest('[data-pool]'));
});
document.addEventListener('change', e => {  // snap a typed number into range when the box is left
  const t = e.target, box = t.closest('.sl');
  if (!box || !t.classList.contains('sl-num') || t.value === '') return;
  const r = box.querySelector('.sl-range');
  t.value = r.value;
});

/* storage pool group on the Settings page */
function refreshPool(g) {
  if (!g) return;
  const ir = g.querySelector('.sl-pint .sl-range'), inum = g.querySelector('.sl-pint .sl-num');
  const reserve = +g.querySelector('.sl-res .sl-range').value;
  const max = intPoolMax(reserve);  // a bigger Android reserve shrinks how far the internal pool can go
  ir.max = inum.max = max;
  if (+ir.value > max) { ir.value = max; inum.value = max; }
  paint(ir);
  const mk = g.querySelector('.sl-pint .mk');
  if (mk) mk.style.left = markLeft(Math.max(+ir.min, POOL.intUsed), +ir.min, max);
  const internal = +ir.value, sd = +g.querySelector('.sl-psd .sl-range').value, total = internal + sd;
  const out = g.querySelector('.pool-preview');
  out.innerHTML = total < POOL.promised
    ? `<span class="bad">Pool ${gbv(total)} is smaller than the ${gbv(POOL.promised)} already promised to apps. Lower app allocations first.</span>`
    : `Pool: <b>${gbv(total)}</b> (${gbv(internal)} internal + ${gbv(sd)} SD card) · ${gbv(POOL.promised)} promised to apps · ${gbv(total - POOL.promised)} unpromised · ${fgb(POOL.used)} in use`;
}

/* allocation popup from the Apps list */
function allocSlider(a) {
  const min = Math.max(0.5, Math.ceil(a.used * 2) / 2);
  return slider({ min, max: allocMax(a), step: 0.5, value: a.alloc, unit: 'GB', cls: 'sl-alloc',
    marks: [{ v: a.used, label: 'in use ' + fgb(a.used), color: C.muted }, { k: 'warn', v: a.alloc * a.warn / 100, label: 'warning', color: C.yellow }] });
}
function openAlloc(id) {
  const a = APPS.find(x => x.id === id);
  $('modal-box').innerHTML = `<h3>Allocation · ${a.name}</h3>
    <div class="body" data-ag data-used="${a.used}" data-warn="${a.warn}">
      ${allocSlider(a)}
      <p class="sl-preview" style="margin:10px 0 0"></p>
      <p class="faint" style="margin:6px 0 0">Up to ${gbv(allocMax(a))}: this app's allocation plus the ${gbv(POOL.unpromised)} of the pool not yet promised to any app. It can't go below what the app already holds.</p>
    </div>
    <div class="foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal()">Save</button></div>`;
  $('modal').hidden = false;
  refreshGroup($('modal-box').querySelector('[data-ag]'));
}
function closeModal() { $('modal').hidden = true; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- data (sample, internally consistent) ---------- */
const DEVICES = {
  desktop: { name:'Desktop PC',          ip:'100.101.12.4', os:'Windows 11',               seen:'just now' },
  s24:     { name:'Galaxy S24 Ultra',    ip:'100.88.3.21',  os:'Android 16',               seen:'4 min ago' },
  gha:     { name:'GitHub Actions',      ip:'100.70.211.9', os:'Linux runner · temporary', seen:'1 h ago' },
  pocket:  { name:'pocket (this phone)', ip:'127.0.0.1',    os:'Android 10',               seen:'just now' },
};
// requests in the last 24 h, per app per device; app and device totals are both derived from this
const REQ_BY = {
  'egx-analyzer': { desktop:6980, s24:1094, gha:1140 },
  'signal-lab':   { pocket:4690, desktop:270 },
  'racedeck':     { desktop:3880 },
  'deskglow':     { pocket:288 },
  'spen-lab':     { s24:42 },
  'matchgame':    { desktop:0 },
};
const APPS = [

function setAddress(h, replace) {

}
function go(h) { setAddress(h); route(h); }
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');

});

function route(target) {
  const h = target ?? (location.hash.slice(1) || 'overview');
  const [p, ...rest] = h.split('/');
  const arg = rest.join('/');
  const page = PAGES.some(x => x[0] === p) ? p : 'overview';

  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'p-' + page);
  RENDER[page](arg ? decodeURIComponent(arg) : '');
  window.scrollTo(0, 0);
}

function listing(app, space, path) {
  const key = `${app}/${space}/${path}`;
  if (TREE[key]) return TREE[key];
  const r = rng(hash(key));
  if (/prices\/[A-Z]+\.CA\/$/.test(path)) return Array.from({ length: 12 }, (_, i) => {
    const d = new Date(NOW); d.setDate(d.getDate() - i);
    return ['f', `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`, (280 + r() * 60) * KB, i]; });
  const folders = ['data/', 'cache/', 'state/'].slice(0, 1 + Math.floor(r() * 3)).map(f => ['d', f, Math.floor(5 + r() * 200), (1 + r() * 60) * MB]);
  const files = ['settings.json', 'index.json', 'latest.bin', 'notes.txt'].map((f, i) => ['f', f, (2 + r() * 900) * KB, Math.floor(r() * 20)]);
  return path.split('/').length > 3 ? files : [...folders, ...files];
}

      ${frow('Large upload buffer', 'Memory for uploads sent in parts', slider({ min: 16, max: 256, step: 16, value: 64, unit: 'MB' }))}
      ${frow('Unfinished uploads expire after', '', slider({ min: 1, max: 72, value: 24, unit: 'hours' }))}
      ${frow('Directory cache', 'Refreshed automatically after each nightly move', slider({ min: 5, max: 300, step: 5, value: 30, unit: 'seconds' }))}
      ${frow('Restart services', 'Gateway and storage server', '<button class="btn">Restart</button>')}
    </div></div>
    <h2>Control panel</h2>
    <div class="panel"><div class="form">
      ${frow('Admin password', '', '<button class="btn">Change password</button>')}
      ${frow('Settings backup', 'All settings, apps and keys in one file', '<button class="btn">Download backup</button><button class="btn">Restore from file</button>')}
    </div></div>
    <div class="actions" style="margin-top:16px"><button class="btn primary">Save changes</button><button class="btn">Discard</button></div>`;
  refreshPool($('p-settings').querySelector('[data-pool]'));
};

/* logs */
const LOGKEYS = {
  'egx-analyzer': ['shared/prices/COMI.CA/2026-10-10.json', 'shared/prices/ETEL.CA/2026-10-10.json', 'shared/analysis/2026-10-10/report.json', 'device/settings.json', 'shared/exports/2026-10-10-daily.csv'],
  'signal-lab': ['shared/candles/BTCUSDT/1m/2026-10-10.parquet', 'shared/candles/ETHUSDT/5m/2026-10-10.parquet', 'device/state/scanner.json'],
  'racedeck': ['shared/sessions/2026/mexico/fp2/timing.parquet', 'shared/sessions/2026/mexico/fp2/positions.parquet', 'device/widgets/layout.json'],
  'deskglow': ['device/screens/clock-layout.json', 'device/settings.json'],
  'spen-lab': ['device/recordings/2026-10-07-circle.json'],
};
const LOGS = (() => {
  const out = []; let t = new Date(NOW);
  const live = APPS.filter(a => a.req > 0);
  for (let i = 0; i < 60; i++) {
    t = new Date(t - (2 + R() * 40) * 1000);
    const a = pick(live, live.map(x => x.req));
    const dev = pick(a.devs, a.devs.map(d => a.reqBy[d]));
    const op = pick(['GetObject', 'PutObject', 'ListObjectsV2', 'HeadObject', 'DeleteObject'], [60, 18, 12, 8, 2]);
    let key = pick(LOGKEYS[a.id], LOGKEYS[a.id].map(() => 1));
    if (op === 'ListObjectsV2') key = key.split('/').slice(0, -1).join('/') + '/';
    let status = op === 'DeleteObject' ? 204 : 200;
    if (op === 'HeadObject' && R() < 0.25) status = 404;
    const bytes = op === 'GetObject' || op === 'PutObject' ? (key.endsWith('.parquet') ? 1.5 * MB + R() * 9 * MB : 3 * KB + R() * 400 * KB) : op === 'ListObjectsV2' ? 2 * KB + R() * 18 * KB : 0;
    out.push({ t, app: a.id, dev, op, key, status, bytes, ms: Math.round(op === 'GetObject' && bytes > MB ? 80 + R() * 400 : 6 + R() * 40) });
  }
  return out;
})();
const SYSLOG = `2026-10-10 22:55:01  health   11 of 11 checks passed (battery 100%, 33.8 °C, internal free 49.8 GB, SD free 228.7 GB)
2026-10-10 22:50:01  health   11 of 11 checks passed
2026-10-10 03:30:04  jobs     undo cleanup finished: 37 files, 21 MB removed (deleted before Sep 26)
2026-10-10 03:16:02  jobs     move finished: 214 files, 88 MB moved to SD card; directory cache refreshed
2026-10-10 03:10:00  jobs     move started: 6 apps, rule = unchanged ≥ move age and not changed in last 24 h
2026-10-10 03:01:48  jobs     nightly copy finished: 318 files, 76 MB copied to SD card
2026-10-10 03:00:00  jobs     nightly copy started
2026-10-09 21:14:37  alerts   egx-analyzer at 80.2% of 3 GB allocation (warning sent)
2026-10-08 16:40:12  enroll   device Galaxy S24 Ultra (100.88.3.21) joined egx-analyzer; key PK…issued
2026-10-06 15:37:01  alerts   phone temperature back to 39.4 °C (cleared)
2026-10-06 15:02:01  alerts   phone temperature 43.1 °C above 42 °C (warning sent)
2026-10-04 02:20:14  gateway  started, listening on 100.92.14.7:9000
2026-10-04 02:20:13  storage  rclone serve s3 started for 6 apps
2026-10-04 02:20:11  boot     Termux:Boot ran after unlock; last heartbeat before restart 02:11:03
2026-10-04 02:20:11  alerts   storage was offline 02:11–02:20 (phone restart, waited for unlock)`;
let LOGF = { app: '', dev: '', op: '', status: '', q: '', tab: 'req' };
RENDER.logs = (arg) => {
  if (arg) { LOGF = { ...LOGF, app: arg, tab: 'req' }; setAddress('logs', true); }
  const rows = LOGS.filter(r => (!LOGF.app || r.app === LOGF.app) && (!LOGF.dev || r.dev === LOGF.dev) && (!LOGF.op || r.op === LOGF.op)
    && (!LOGF.status || (LOGF.status === 'err' ? r.status >= 400 : r.status < 400)) && (!LOGF.q || r.key.includes(LOGF.q)));
  const sel = (k, opts) => `<select onchange="LOGF.${k}=this.value;RENDER.logs()">${opts.map(([v, l]) => `<option value="${v}"${LOGF[k] === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  $('p-logs').innerHTML = `
    <h1>Logs</h1><p class="sub">Every request to the server is recorded. Detailed logs are kept for 90 days.</p>
    <div class="tabs"><a class="${LOGF.tab === 'req' ? 'on' : ''}" onclick="LOGF.tab='req';RENDER.logs()">Requests</a><a class="${LOGF.tab === 'sys' ? 'on' : ''}" onclick="LOGF.tab='sys';RENDER.logs()">System</a></div>
    ${LOGF.tab === 'sys' ? `<pre class="block log">${SYSLOG}</pre>` : `
    <div class="filters">
      ${sel('app', [['', 'All apps'], ...APPS.map(a => [a.id, a.name])])}
      ${sel('dev', [['', 'All devices'], ...Object.entries(DEVICES).map(([k, d]) => [k, d.name])])}
      ${sel('op', [['', 'All operations'], ...['GetObject', 'PutObject', 'ListObjectsV2', 'HeadObject', 'DeleteObject'].map(o => [o, o])])}
      ${sel('status', [['', 'All results'], ['ok', 'Successful'], ['err', 'Errors']])}
      <input type="text" placeholder="Search file name" value="${esc(LOGF.q)}" onchange="LOGF.q=this.value;RENDER.logs()">
      <span class="muted" style="align-self:center">${rows.length} of ${LOGS.length} shown</span>
    </div>
    <div class="panel"><div class="tw"><table>
      <thead><tr><th>Time</th><th>App</th><th>Device</th><th>Operation</th><th>File</th><th class="num">Size</th><th class="num">Result</th><th class="num">Took</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="mono muted">${hms(r.t)}</td><td>${APPS.find(a => a.id === r.app).name}</td><td class="muted">${DEVICES[r.dev].name}</td>
        <td class="mono">${r.op}</td><td class="mono">${esc(r.key)}</td><td class="num">${r.bytes ? fb(r.bytes) : '—'}</td>
        <td class="num ${r.status >= 400 ? 'warn' : 'muted'}">${r.status}</td><td class="num muted">${r.ms} ms</td></tr>`).join('') || '<tr><td colspan="8" class="muted">No requests match.</td></tr>'}</tbody>
    </table></div></div>`}`;
};

route();
</script>
